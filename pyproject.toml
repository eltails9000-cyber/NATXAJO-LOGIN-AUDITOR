[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natxajo-login-auditor"
version = "0.1.0"
description = "Plataforma modular de auditoría defensiva de autenticación"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "eltails9000-cyber" }]
dependencies = []

[project.optional-dependencies]
# Rangos de las versiones probadas (docs/DEPENDENCIAS.md). Ampliar un rango exige ejecutar la
# suite con la nueva versión y actualizar requirements-dev.lock.
dev = ["pytest>=9.1,<10", "ruff>=0.16,<0.17", "mypy>=2.3,<3"]

[project.scripts]
natxajo-auditor = "natxajo_auditor.main:main"
natxajo = "natxajo_auditor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"natxajo_auditor.interfaces.gui" = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
